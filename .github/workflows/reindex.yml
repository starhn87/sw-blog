name: Reindex after post changes

on:
  push:
    branches: [main]
    paths:
      - "content/posts/**"
  workflow_dispatch:

jobs:
  reindex:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Cloudflare Pages deployment
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "Waiting for deployment of $GITHUB_SHA to complete..."
          DEPLOYED=false
          for i in $(seq 1 30); do
            if ! RESPONSE=$(curl -sf \
                -H "Authorization: Bearer $CF_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/sw-blog/deployments?sort_by=created_on&sort_order=desc&per_page=20"); then
              echo "Attempt $i: deployment API unavailable"
              sleep 20
              continue
            fi
            STATUS=$(echo "$RESPONSE" | jq -r --arg sha "$GITHUB_SHA" \
              '[.result[] | select(
                .environment == "production" and
                .deployment_trigger.metadata.commit_hash == $sha
              )][0].latest_stage.status // "pending"')
            echo "Attempt $i: status=$STATUS"
            if [ "$STATUS" = "success" ]; then
              echo "Deployment complete!"
              DEPLOYED=true
              break
            fi
            if [ "$STATUS" = "failure" ] || [ "$STATUS" = "canceled" ]; then
              echo "Deployment failed, skipping reindex"
              exit 1
            fi
            sleep 20
          done
          if [ "$DEPLOYED" != "true" ]; then
            echo "Deployment did not complete within 10 minutes"
            exit 1
          fi

      - name: Reindex search
        run: |
          curl -sf -X POST https://www.seung-woo.me/api/search/index \
            -H "x-admin-password: ${{ secrets.ADMIN_PASSWORD }}"

      - name: Reindex RAG
        run: |
          curl -sf -X POST https://www.seung-woo.me/api/chat/index \
            -H "x-admin-password: ${{ secrets.ADMIN_PASSWORD }}"
