name: Weekly analytics report

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build report from Cloudflare Web Analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SITE_TAG: 7638c47570614969b00e3429d1419f48 # 비콘 공개 토큰 (폴백용)
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/weekly-analytics-report.mjs

      - name: Open issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WEEK=$(date -u -d "7 days ago" +%m/%d)
          TODAY=$(date -u -d "1 day ago" +%m/%d)
          gh issue create \
            --title "📊 주간 방문 리포트 ($WEEK ~ $TODAY)" \
            --body-file analytics-report.md
