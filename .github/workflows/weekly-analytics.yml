name: Weekly analytics report

on:
  schedule:
    - cron: "0 0 * * 1" # 매주 월요일 09:00 KST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Load previous report snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list \
            --state all \
            --search 'in:title "주간 방문 리포트" sort:created-desc' \
            --limit 1 \
            --json body \
            --jq '.[0].body // ""' > previous-analytics-report.md

      - name: Build report from Cloudflare Web Analytics
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_SITE_TAG: f9fe631f1ab8491b94ebc157812b5072 # 블로그 canonical siteTag
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/weekly-analytics-report.mjs

      - name: Open issue and comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          WEEK=$(date -u -d "7 days ago" +%m/%d)
          TODAY=$(date -u -d "1 day ago" +%m/%d)
          URL=$(gh issue create \
            --title "📊 주간 방문 리포트 ($WEEK ~ $TODAY)" \
            --body-file analytics-report.md)
          echo "issue: $URL"
          if [ -f claude-comment.md ]; then
            gh issue comment "$URL" --body-file claude-comment.md
          fi
