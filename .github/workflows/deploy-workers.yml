name: Deploy Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sw-blog-production
  cancel-in-progress: false

jobs:
  deploy:
    # Enable only after the approved Pages cutover; unset also means disabled.
    if: github.ref == 'refs/heads/main' && vars.WORKERS_PRODUCTION_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm rebuild esbuild sharp workerd
      - run: pnpm verify

      - name: Build production without runtime secrets
        env:
          NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ vars.NEXT_PUBLIC_GOOGLE_MAPS_API_KEY }}
          NEXT_PUBLIC_NAVER_MAP_CLIENT_ID: ${{ vars.NEXT_PUBLIC_NAVER_MAP_CLIENT_ID }}
        run: pnpm workers:build:production

      - name: Validate upload and Workers Free bundle size
        run: pnpm workers:check:production

      - name: Check cutover state and runtime secrets before deploying
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)" = "$GITHUB_SHA"
          node scripts/check-workers-cutover.mjs

      - name: Compare index inputs with the current deployment
        id: indexes
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          const release = JSON.parse(readFileSync('.open-next/release.json'));
          let changed = false;
          for (const name of ['search-index.json', 'rag-chunks.json']) {
            const response = await fetch(`https://www.seung-woo.me/${name}?release=${release.buildId}`, {redirect:'manual', headers:{'Cache-Control':'no-cache'}, signal:AbortSignal.timeout(30000)});
            if (response.status !== 200) throw new Error(`Cannot compare deployed index: ${name}`);
            const digest = createHash('sha256').update(Buffer.from(await response.arrayBuffer())).digest('hex');
            changed ||= digest !== release.assets[name].sha256;
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `changed=${changed}\n`);
          NODE

      - name: Deploy verified commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --config wrangler.worker.jsonc --env production --tag "$GITHUB_SHA"

      - name: Verify deployed release before indexing
        run: pnpm workers:verify-release

      - name: Reindex the deployed release
        if: steps.indexes.outputs.changed == 'true' || github.event_name == 'workflow_dispatch'
        env:
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: node scripts/reindex-worker.mjs
